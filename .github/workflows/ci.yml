name: CI

on:
  push:
  pull_request:

# Le contrôle lit le dépôt, jamais plus : aucun secret, aucun droit d'écriture.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Refuser les secrets PISTE versionnés
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env est suivi par git."
            exit 1
          fi
          if git grep -qE 'PISTE_(CLIENT_SECRET|KEY_ID)=[^[:space:]]' -- ':!.env.example'; then
            echo "::error::Un secret PISTE est versionné."
            exit 1
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
